#Bitácora 04 
#Levanta servicios de un ssh y un entonrno gráfico
version: '3.8'
services:
#Servidor para practicas de SSH
  servidor_ssh:
    image: linuxserver/openssh-server:latest
    container_name: lab_ssh_servidor
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - USER_NAME=alumno
      - USER_PASSWORD=sistemas_informaticos
      - PASSWORD_ACCESS=true
    ports:
      - "2222:2222" #puerto mapeado del local al contenedor
    restart: unless-stopped

  servidor_rdp:
    image: linuxserver/webtop:ubuntu-xfce
    container_name: lab_rdp_servidor
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "3389:3389" #Puerto estandar escritorio remoto
      - "3000:3000" #Puerto para acceso por el navegador
    shm_size: "1gb"
    restart: unless-stopped